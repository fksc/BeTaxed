# Deploy staging on merge to dev.
# Builds and pushes images, runs Alembic through the Cloud SQL proxy, then
# swaps the Cloud Run image. The service YAML keeps env, secrets, and Cloud SQL.
# Linear Anteater-Staging is continuous: sync only.
name: Deploy Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      sync_linear_only:
        description: Sync Linear staging release only (skip deploys)
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  ARTIFACT_REGISTRY: ${{ vars.ARTIFACT_REGISTRY || 'europe-west1-docker.pkg.dev/project-76d4a590-35c3-4fa2-936/anteater' }}
  ARTIFACT_REGISTRY_HOST: europe-west1-docker.pkg.dev
  BACKEND_SERVICE: ${{ vars.BACKEND_SERVICE_STAGING || 'anteater-backend-staging' }}
  FRONTEND_SERVICE: ${{ vars.FRONTEND_SERVICE_STAGING || 'anteater-frontend-staging' }}
  CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME || 'project-76d4a590-35c3-4fa2-936:europe-west1:anteater-staging' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.BACKEND_SERVICE }}:staging

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUD_SQL_CONNECTION_NAME: ${{ env.CLOUD_SQL_CONNECTION_NAME }}
        run: |
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.21.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$CLOUD_SQL_CONNECTION_NAME" &
          PROXY_PID=$!
          for _ in $(seq 1 30); do
            (echo >/dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break
            sleep 1
          done
          cd backend
          pip install -r requirements.txt
          export DATABASE_URL="$(python - <<'PY'
          import os
          from urllib.parse import quote, unquote, urlparse
          raw = os.environ["DATABASE_URL"]
          parsed = urlparse(raw.replace("postgresql+asyncpg://", "postgresql://", 1))
          user = quote(unquote(parsed.username or ""), safe="")
          password = quote(unquote(parsed.password or ""), safe="")
          database = parsed.path.lstrip("/")
          if not database:
              raise SystemExit("DATABASE_URL is missing a database name")
          print(f"postgresql+asyncpg://{user}:{password}@127.0.0.1:5432/{database}")
          PY
          )"
          alembic upgrade head
          kill "$PROXY_PID" || true

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "${{ env.BACKEND_SERVICE }}" \
            --image "${{ env.ARTIFACT_REGISTRY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --quiet

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.FRONTEND_SERVICE }}:staging
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://anteater-backend-staging-2w44u4afna-ew.a.run.app' }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'anteater-9d782.firebaseapp.com' }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'anteater-9d782' }}
            NEXT_PUBLIC_MARKETING_URL=${{ vars.NEXT_PUBLIC_MARKETING_URL || 'https://anteater.pt' }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy "${{ env.FRONTEND_SERVICE }}" \
            --image "${{ env.ARTIFACT_REGISTRY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --quiet

  linear-release:
    needs: [changes, deploy-backend, deploy-frontend]
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.sync_linear_only) ||
        (
          (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
          (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
          (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
          (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success')
        )
      )
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Linear staging release
        uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY_STAGING }}
          links: |
            GitHub Actions=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
