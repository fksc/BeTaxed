# Local PostgreSQL 18 + Redis 8 + Firebase Auth emulator.
# Do not use these credentials in production.
services:
  postgres:
    image: postgres:18-bookworm
    container_name: betaxed-postgres
    environment:
      POSTGRES_USER: betaxed
      POSTGRES_PASSWORD: betaxed_dev
      POSTGRES_DB: betaxed
    ports:
      - "5432:5432"
    volumes:
      - betaxed_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betaxed -d betaxed"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: betaxed-redis
    ports:
      - "6380:6379"
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  firebase-auth:
    build:
      context: .
      dockerfile: docker/firebase-auth/Dockerfile
    container_name: betaxed-firebase-auth
    ports:
      - "9099:9099"
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9099/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  betaxed_pg_data:
