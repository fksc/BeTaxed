# Staging web app. Build after the backend URL exists so the client
# calls that host instead of the local /v1 proxy.
#   gcloud builds submit --config infra/cloudbuild/frontend.yaml . \
#     --substitutions=_API_URL=https://BACKEND_URL,_FIREBASE_API_KEY=YOUR_KEY
#   gcloud run services replace infra/cloudrun/frontend.staging.yaml --region=europe-west1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: anteater-frontend-staging
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: anteater-run-staging@project-76d4a590-35c3-4fa2-936.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: europe-west1-docker.pkg.dev/project-76d4a590-35c3-4fa2-936/anteater/frontend:staging
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
