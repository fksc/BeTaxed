# Knative / Cloud Run (v1) — frontend Next.js (standalone)
# Deploy: gcloud run services replace frontend.service.yaml --region=REGION
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: betaxed-frontend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/betaxed/frontend:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
