# Staging API. Apply only after the image exists:
#   gcloud builds submit --config infra/cloudbuild/backend.yaml .
#   gcloud run services replace infra/cloudrun/backend.staging.yaml --region=europe-west1
#
# Cloud Run will not create this service for a tag that is not in Artifact Registry.
# /health starts without Cloud SQL. /ready needs the database.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: anteater-backend-staging
  labels:
    cloud.googleapis.com/location: europe-west1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        # Uncomment when Cloud SQL anteater-staging exists.
        # run.googleapis.com/cloudsql-instances: project-76d4a590-35c3-4fa2-936:europe-west1:anteater-staging
    spec:
      serviceAccountName: anteater-run-staging@project-76d4a590-35c3-4fa2-936.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: europe-west1-docker.pkg.dev/project-76d4a590-35c3-4fa2-936/anteater/backend:staging
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: ENV
              value: staging
            - name: FIREBASE_PROJECT_ID
              value: anteater-9d782
            - name: GOOGLE_CLOUD_PROJECT
              value: project-76d4a590-35c3-4fa2-936
            - name: VERTEX_LOCATION
              value: europe-west1
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: CONTRACT_LLM
              value: gemini
            - name: CLOUD_TASKS_QUEUE
              value: anteater-staging
            - name: CLOUD_TASKS_LOCATION
              value: europe-west1
