# Knative / Cloud Run (v1) — backend FastAPI
# Deploy: gcloud run services replace backend.service.yaml --region=REGION
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: betaxed-backend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/betaxed/backend:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
