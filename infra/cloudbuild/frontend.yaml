# Build and push the staging web image.
# NEXT_PUBLIC_* are baked into the client. Pass the live backend URL and the
# Firebase web API key. Do not commit the key.
#
#   gcloud builds submit --config infra/cloudbuild/frontend.yaml . \
#     --substitutions=_API_URL=https://BACKEND_URL,_FIREBASE_API_KEY=YOUR_KEY
steps:
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -ceu
      - |
        if [ -z "${_API_URL}" ] || [ -z "${_FIREBASE_API_KEY}" ]; then
          echo "Set _API_URL and _FIREBASE_API_KEY." >&2
          exit 1
        fi
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - -t
      - ${_IMAGE}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}
      - frontend
images:
  - ${_IMAGE}
substitutions:
  _TAG: staging
  _IMAGE: europe-west1-docker.pkg.dev/${PROJECT_ID}/anteater/frontend:${_TAG}
  _API_URL: ""
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: anteater-9d782.firebaseapp.com
  _FIREBASE_PROJECT_ID: anteater-9d782
options:
  logging: CLOUD_LOGGING_ONLY
